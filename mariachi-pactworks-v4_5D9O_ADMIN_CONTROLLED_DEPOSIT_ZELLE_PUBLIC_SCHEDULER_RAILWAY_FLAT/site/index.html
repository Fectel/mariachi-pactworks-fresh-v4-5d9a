<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariachi Hermanos Azteca | Arizona</title>
<meta name="description" content="Mariachi Hermanos Azteca en Arizona. Mira precios y solicita tu presentación.">
<meta name="theme-color" content="#590013">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--wine:#590013;--wine2:#3b000d;--gold:#e1b64e;--gold2:#f4cf6b;--cream:#fff8e8;--paper:#fffdf8;--ink:#2d211c;--muted:#75675f;--line:#dfccb0}
*{box-sizing:border-box}html{min-width:320px;background:var(--wine2)}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(180deg,var(--wine2),var(--wine) 55%,#f5ebda 55%,#f5ebda)}
a{text-decoration:none}.top{width:min(1180px,100%);margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px}.pyramid-logo{width:44px;height:44px;border-radius:11px;border:1px solid #a8752c;background:linear-gradient(145deg,#4e0010,#74152a);box-shadow:inset 0 0 0 1px rgba(244,207,107,.18),0 5px 16px rgba(91,0,19,.12);display:grid;place-items:center;overflow:hidden}
.pyramid-logo svg{width:34px;height:34px;fill:#e1b64e;stroke:#e1b64e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pyramid-logo .mount{fill:none;opacity:.9}.brand b{display:block;color:var(--gold2);font:700 14px Georgia,serif;letter-spacing:.035em}.brand small{display:block;color:#eadbd6;font-size:8px;margin-top:1px}
.lang{display:flex;gap:5px}.lang button{cursor:pointer;border:1px solid rgba(255,255,255,.24);background:transparent;color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:950}.lang button.active{background:var(--gold2);border-color:var(--gold2);color:var(--wine)}
.hero{width:min(1120px,calc(100% - 22px));margin:auto;padding:9px 0 44px;text-align:center}.hero h1{margin:7px 0 3px;font:700 clamp(43px,8vw,84px)/.88 Georgia,serif;color:var(--gold2);letter-spacing:-.035em}.hero h1 span{display:block;color:#fff;font-size:.74em;margin-top:6px}.quickline{margin:10px auto 2px;color:#f7e8da;font-size:13px;font-weight:800;letter-spacing:.025em}
.photo{position:relative;width:min(980px,100%);margin:0 auto -10px;min-height:235px;display:flex;align-items:flex-end;justify-content:center}.photo:before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:40%;background:radial-gradient(ellipse,rgba(244,207,107,.23),transparent 70%);filter:blur(8px)}.photo img{position:relative;width:100%;max-height:520px;object-fit:contain;filter:drop-shadow(0 20px 22px rgba(0,0,0,.28))}
.card{position:relative;width:min(760px,calc(100% - 6px));margin:0 auto;padding:20px 18px;border:1px solid #dfc171;border-radius:23px;background:rgba(255,253,248,.99);color:var(--ink);box-shadow:0 24px 68px rgba(45,4,13,.24)}
.action{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.72fr);gap:9px}.btn{min-height:52px;border-radius:13px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 14px;background:#fff;color:var(--wine);font-size:13px;font-weight:1000}.btn.primary{background:linear-gradient(180deg,#79152b,var(--wine));border-color:var(--wine);color:#fff}.btn.gold{background:#d3a338;border-color:#d3a338;color:#2b1700}.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.icon-card{padding:10px 7px;border:1px solid #eadbbf;border-radius:12px;background:#fff9ed;color:#6a584c;font-size:9px;font-weight:850}.icon-card svg{display:block;width:23px;height:23px;margin:0 auto 5px;fill:none;stroke:var(--wine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.private{margin-top:12px;color:#8a786b;font-size:9px}.private a{color:#72584c;text-decoration:underline;text-underline-offset:3px;font-weight:950}
footer{text-align:center;padding:32px 15px 40px;color:#817166;font-size:9px}.footer-admin-link{display:inline-block;margin-top:10px;color:#9a8b80;font-size:7px;letter-spacing:.04em;text-decoration:none;opacity:.72}.footer-admin-link:hover{opacity:1;text-decoration:underline}
@media(max-width:720px){body{background:linear-gradient(180deg,var(--wine2),var(--wine) 50%,#f5ebda 50%,#f5ebda)}.top{padding:9px 10px}.brand small{display:none}.brand b{font-size:11px}.lang button{padding:7px 8px}.hero{padding-top:2px}.hero h1{font-size:43px}.quickline{font-size:11px}.photo{min-height:185px;margin-bottom:-2px}.card{padding:15px 11px;border-radius:18px}.action{grid-template-columns:1fr}.icons{gap:5px}.icon-card{padding:9px 4px;font-size:8px}}

.icon-card-link{text-decoration:none;color:inherit;cursor:pointer}
.icon-card-link:hover{transform:translateY(-1px)}
a.nav-loading{pointer-events:none;opacity:.72;cursor:wait}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="pyramid-logo" aria-label="Emblema pirámide Mariachi Hermanos Azteca">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="13" r="7"/>
        <path d="M27 22h10l3 6H24zM21 31h22l4 7H17zM14 41h36l5 9H9z"/>
        <path class="mount" d="M6 38l8-9 6 6 7-9 8 8 7-7 14 14"/>
      </svg>
    </div>
    <div><b>Mariachi Hermanos Azteca</b><small>Arizona</small></div>
  </div>
  <div class="lang" aria-label="Idioma">
    <button id="es" class="active" type="button">🇲🇽 Español</button>
    <button id="en" type="button">🇺🇸 English</button>
  </div>
</header>

<main class="hero">
  <h1>MARIACHI <span>HERMANOS AZTECA</span></h1>
  <div class="quickline" id="quickline">Bodas • XV • Serenatas • Eventos</div>
  <div class="photo"><img src="/assets/mariachi-group.webp" alt="Mariachi Hermanos Azteca" fetchpriority="high"></div>
  <section class="card">
    <div class="action">
      <a class="btn primary" href="/pricing/" id="pricingBtn">
        <svg viewBox="0 0 24 24"><path d="M20 13 13 20l-9-9V4h7z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg><span>Ver precios</span>
      </a>
      <a class="btn gold" href="tel:+16027435681" id="callBtn">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 1.9z"/></svg><span>Llamar / Texto</span>
      </a>
    </div>
    <div class="icons">
      <a class="icon-card icon-card-link" href="/pricing/" id="pricesFirstCard"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M16 8.5c-.8-.8-2-1.3-3.4-1.3-2 0-3.4 1-3.4 2.4 0 3.6 6.4 1.7 6.4 5 0 1.4-1.4 2.4-3.5 2.4-1.5 0-2.9-.5-3.8-1.4M12 5v14"/></svg><span id="i1">Precios primero</span></a>
      <a class="icon-card icon-card-link" href="/pricing/" id="reserveCard"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="i2">Arizona</span></div>
      <div class="icon-card"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg><span id="i3">Solicitud → Reserva</span></a>
    </div>
  </section>
</main>
<footer><div>© <span id="copyrightYear"></span> Mariachi Hermanos Azteca • 602-743-5681 • Arizona</div><a class="footer-admin-link" href="/admin/" rel="nofollow">PactWorks Admin</a></footer>
<script>
const COPY={es:{quick:'Bodas • XV • Serenatas • Eventos',price:'Ver precios',call:'Llamar / Texto',i1:'Precios primero',i2:'Arizona',i3:'Solicitud → Reserva'},en:{quick:'Weddings • XV • Serenades • Events',price:'View pricing',call:'Call / Text',i1:'See prices first',i2:'Arizona',i3:'Request → Reserve'}};
function setLanguage(l){document.documentElement.lang=l;document.getElementById('es').classList.toggle('active',l==='es');document.getElementById('en').classList.toggle('active',l==='en');const x=COPY[l];document.getElementById('quickline').textContent=x.quick;document.querySelector('#pricingBtn span').textContent=x.price;document.querySelector('#callBtn span').textContent=x.call;document.getElementById('i1').textContent=x.i1;document.getElementById('i2').textContent=x.i2;document.getElementById('i3').textContent=x.i3;localStorage.setItem('mha_public_lang',l)}
document.getElementById('copyrightYear').textContent=new Date().getFullYear();document.getElementById('es').onclick=()=>setLanguage('es');document.getElementById('en').onclick=()=>setLanguage('en');setLanguage(localStorage.getItem('mha_public_lang')==='en'?'en':'es');document.querySelectorAll('a[href="/pricing/"]').forEach(a=>a.addEventListener('click',()=>{if(a.classList.contains('nav-loading'))return;a.classList.add('nav-loading');a.setAttribute('aria-busy','true')}));
</script>
</body>
</html>
